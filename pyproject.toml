[project]
name = "mai"
version = "0.1.0"
description = "MAI · Mesa de Ayuda Inteligente"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "bandit>=1.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S"]
# N818 exige el sufijo "Error" en las excepciones. Es una convención inglesa
# (`SomethingError`); el dominio de este proyecto se nombra en español, donde
# el equivalente es el prefijo (`ErrorDeAlgo`). Lleva la misma información.
ignore = ["N818"]
# Excepciones solo para pruebas, cada una con su motivo:
#   S101 — `assert` es el mecanismo de pytest, no un descuido.
#   S105/S106/S107 — los tokens literales de las pruebas son valores de
#     relleno contra un transporte simulado. No abren nada. La regla es
#     correcta y se mantiene activa en src/, que es donde importa.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106", "S107"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# El modulo heredado se corrige, no se adopta: vive en legacy/ y no es parte
# del paquete mai. Esta linea le da a pytest la ruta para importarlo sin
# convertirlo en dependencia de src/.
pythonpath = ["legacy"]
